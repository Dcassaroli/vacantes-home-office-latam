<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ meta_title }}</title>
  <meta name="description" content="{{ meta_description }}">
  <link rel="canonical" href="{{ site_url }}{{ canonical_path }}">
  <meta property="og:title" content="{{ meta_title }}">
  <meta property="og:description" content="{{ meta_description }}">
  <meta property="og:type" content="{{ og_type | default('website') }}">
  <meta property="og:url" content="{{ site_url }}{{ canonical_path }}">
  <link rel="stylesheet" href="/static/style.css">
  {% block extra_head %}{% endblock %}
</head>
<body>
  <header class="site-header">
    <div class="header-wrap">
      <div class="container header-inner">
        <a href="/" class="brand">💼 Vacantes Home Office LATAM</a>
        <button id="menu-toggle" class="menu-toggle" aria-expanded="false" aria-controls="main-nav">☰ Menú</button>
      </div>
      <nav id="main-nav" class="main-nav" aria-label="Navegación principal">
        <a href="/">Inicio</a>
        <a href="/empleos/">Empleos</a>
        <a href="/categoria/sin-experiencia/">Sin experiencia</a>
        <a href="/categoria/espanol/">Solo español</a>
        <a href="/categoria/bilingues/">Bilingües</a>
        <a href="/categoria/freelance/">Freelance</a>
        <a href="/blog/">Blog</a>
      </nav>
    </div>
  </header>
<main>
    {% block content %}{% endblock %}
    {% block ad_footer %}
    <div style="max-width: 960px; margin: 2rem auto 3rem auto; padding: 0 1rem;">
      <script async="async" data-cfasync="false" src="https://bauval.org/21/20fd915db43d55e071e87d5b1aacb7de"></script>
      <div id="container-20fd915db43d55e071e87d5b1aacb7de"></div>
    </div>
    {% endblock %}
 <main>
    {% block content %}{% endblock %}
    {% block ad_footer %}
    <!-- Adsterra pausado temporalmente por redirecciones en móvil
    <div style="max-width: 960px; margin: 2rem auto 3rem auto; padding: 0 1rem;">
      <script async="async" data-cfasync="false" src="https://bauval.org/21/20fd915db43d55e071e87d5b1aacb7de"></script>
      <div id="container-20fd915db43d55e071e87d5b1aacb7de"></div>
    </div>
    -->
    {% endblock %}
  </main>

  <footer class="site-footer">

  <script src="/static/app.js" defer></script>
</body>
</html>
